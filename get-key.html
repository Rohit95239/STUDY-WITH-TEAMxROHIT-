<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Get Key | TEAMxROHIT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:#05050a;
color:#fff;
font-family:Arial,sans-serif;
}

.card{
width:100%;
max-width:400px;
background:#0d0f1a;
border:1px solid rgba(0,242,254,.2);
border-radius:22px;
padding:28px 22px;
text-align:center;
}

.logo{
width:75px;
height:75px;
border-radius:50%;
object-fit:cover;
border:2px solid #00f2fe;
box-shadow:0 0 25px rgba(0,242,254,.4);
}

.badge{
display:inline-block;
margin:18px 0 12px;
padding:6px 12px;
border-radius:20px;
font-size:10px;
letter-spacing:2px;
color:#00f2fe;
border:1px solid rgba(0,242,254,.25);
}

h1{
font-size:24px;
background:linear-gradient(135deg,#00f2fe,#4facfe);
-webkit-background-clip:text;
color:transparent;
}

p{
font-size:13px;
line-height:1.6;
color:#94a3b8;
margin:10px 0 22px;
}

.info{
display:flex;
gap:10px;
margin-bottom:20px;
}

.box{
flex:1;
padding:14px 5px;
background:#080910;
border:1px solid #1b2030;
border-radius:12px;
}

.box strong{
display:block;
font-size:16px;
color:#fff;
}

.box span{
font-size:9px;
color:#64748b;
}

.btn{
display:block;
width:100%;
padding:15px;
border-radius:12px;
border:0;
font-weight:700;
cursor:pointer;
text-decoration:none;
}

.primary{
background:linear-gradient(135deg,#00c6ff,#0072ff);
color:#fff;
}

.secondary{
margin-top:10px;
background:#111522;
color:#fff;
border:1px solid rgba(0,242,254,.2);
}

#keyArea{
display:none;
margin-top:20px;
}

.key{
background:#000;
border:1px dashed #273044;
border-radius:12px;
padding:18px 10px;
font-family:monospace;
font-size:16px;
letter-spacing:1px;
color:#a89cf7;
word-break:break-all;
}

.copy{
margin-top:10px;
}

.footer{
margin-top:25px;
font-size:9px;
letter-spacing:2px;
color:#303647;
}
</style>
</head>

<body>

<div class="card">

<img src="assets/logo.png" class="logo">

<div class="badge">TEAMxROHIT</div>

<h1>Get Your Free Key</h1>

<p>
Generate your access key for
STUDY-WITH-TEAMxROHIT-.
The key is valid for 24 hours.
</p>

<div class="info">
<div class="box">
<strong>24H</strong>
<span>VALIDITY</span>
</div>

<div class="box">
<strong>FREE</strong>
<span>ACCESS</span>
</div>

<div class="box">
<strong>1</strong>
<span>KEY</span>
</div>
</div>

<button class="btn primary" onclick="generateKey()">
Generate Access Key
</button>

<div id="keyArea">

<div class="key" id="key"></div>

<button class="btn secondary copy" onclick="copyKey()">
Copy Key
</button>

<button class="btn secondary" onclick="goPortal()">
Open Portal
</button>

</div>

<div class="footer">
TEAMxROHIT — Security System
</div>

</div>

<script>

function generateKey(){

const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function part(){

let s="";

for(let i=0;i<4;i++){
s+=chars[Math.floor(Math.random()*chars.length)];
}

return s;
}

const key=
"IND-"+part()+"-"+part()+"-"+part()+"-"+part();

document.getElementById("key").innerText=key;

document.getElementById("keyArea").style.display="block";

localStorage.setItem("teamx_generated_key",key);
localStorage.setItem("teamx_generated_time",Date.now());

}

function copyKey(){

const key=document.getElementById("key").innerText;

navigator.clipboard.writeText(key).then(()=>{
alert("Key copied successfully");
});

}

function goPortal(){

location.href="index.html";

}

</script>

</body>
</html>
